# Repository-level defaults for SonarCloud.
# Organization and project key are passed at workflow runtime.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*test*.go,**/*.test.ts,**/*.test.tsx,**/__tests__/**/*
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/.turbo/**,**/docs/**,**/Documentation/**
sonar.javascript.lcov.reportPaths=apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
sonar.go.coverage.reportPaths=apps/api/coverage.out
sonar.sourceEncoding=UTF-8

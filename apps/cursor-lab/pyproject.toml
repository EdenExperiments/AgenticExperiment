[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cursor-lab"
version = "0.0.1"
description = "Cursor plugin evaluation harness (lab → judge → registry → prod)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "dspy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cursor-lab = "cursor_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cursor_lab"]

artifact_id: skill:skills/core/safe-edit-and-verify
description: Validate that the skill produces a planned, verified edit on a small TS file.
cases:
  - id: case-01-rename-symbol
    input_file: inputs/case-01.md
    seed_dir: seed/case-01
    capability_mix:
      refactor: 0.7
      command_running: 0.2
      doc_update: 0.1
    thresholds:
      min_score: 0.75
      max_variance: 0.10
    runs: 3
  - id: case-02-add-verification
    input_file: inputs/case-02.md
    seed_dir: seed/case-02
    capability_mix:
      refactor: 0.4
      command_running: 0.4
      process: 0.2
    thresholds:
      min_score: 0.75
      max_variance: 0.10
    runs: 3
  - id: case-03-minimal-doc-edit
    input_file: inputs/case-03.md
    seed_dir: seed/case-03
    capability_mix:
      doc_update: 0.5
      process: 0.3
      safety: 0.2
    thresholds:
      min_score: 0.75
      max_variance: 0.10
    runs: 3

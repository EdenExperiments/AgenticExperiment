name: Mend Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
    # Weekly catch-up when weekday-only runs miss long-lived branches.
    - cron: "0 7 * * 0"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check token availability
        id: token-check
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Mend Renovate skipped"
              echo ""
              echo "\`RENOVATE_TOKEN\` is not configured in repository secrets."
              echo "Add a GitHub App token or PAT with repo scope to enable Renovate runs."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Renovate
        if: steps.token-check.outputs.available == 'true'
        uses: renovatebot/github-action@v46.1.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info

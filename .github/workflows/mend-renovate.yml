name: Mend Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
    # Weekly catch-up when weekday-only runs miss long-lived branches.
    - cron: "0 7 * * 0"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate token availability
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "RENOVATE_TOKEN is not configured."
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v43
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info

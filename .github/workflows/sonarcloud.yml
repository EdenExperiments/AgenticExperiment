name: SonarCloud

on:
  workflow_dispatch:
  schedule:
    # Nightly main-branch scan so SonarCloud branch dashboards stay fresh between merges.
    - cron: "15 6 * * *"
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY != '' && vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarCloud inputs
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "SONAR_ORGANIZATION and SONAR_PROJECT_KEY must be set as repo variables or secrets."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript tests with coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:coverage

      - name: Run Go tests with coverage
        run: cd apps/api && go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Enforce SonarCloud PR coverage threshold (>= 80%)
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_MIN_NEW_COVERAGE: ${{ vars.SONAR_MIN_NEW_COVERAGE || '80' }}
        run: |
          quality_response="$(curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY&pullRequest=$PR_NUMBER")"
          quality_status="$(echo "$quality_response" | jq -r '.projectStatus.status // "UNKNOWN"')"
          echo "SonarCloud quality gate status: $quality_status"

          coverage_response="$(curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/measures/component?component=$SONAR_PROJECT_KEY&pullRequest=$PR_NUMBER&metricKeys=new_coverage")"
          new_coverage="$(echo "$coverage_response" | jq -r '.component.measures[]? | select(.metric=="new_coverage") | .value')"

          if [ -z "$new_coverage" ] || [ "$new_coverage" = "null" ]; then
            echo "Could not read SonarCloud new_coverage for PR #$PR_NUMBER."
            echo "Response: $coverage_response"
            exit 1
          fi

          echo "SonarCloud new coverage: $new_coverage (required >= $SONAR_MIN_NEW_COVERAGE)"
          awk -v actual="$new_coverage" -v min="$SONAR_MIN_NEW_COVERAGE" 'BEGIN { exit !(actual + 0 >= min + 0) }'

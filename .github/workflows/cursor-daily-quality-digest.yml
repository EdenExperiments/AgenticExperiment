name: Cursor Daily Quality Digest

on:
  schedule:
    # After Sonar nightly (`sonarcloud.yml` ~06:15 UTC) so branch metrics exist for digest prompts.
    - cron: "35 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    # vars.AGENTS_ENABLED is the repo-side kill-switch for all agent automation (brief §4, M0).
    if: vars.AGENTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure ripgrep path for Cursor SDK
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          echo "CURSOR_RIPGREP_PATH=$(command -v rg)" >> "$GITHUB_ENV"

      - name: Run daily Sonar + dependency-queue digest
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CURSOR_PR_REVIEW_TOKEN != '' && secrets.CURSOR_PR_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURSOR_RUNTIME: ${{ vars.CURSOR_RUNTIME || 'local' }}
          CURSOR_CLOUD_REPO_URL: ${{ vars.CURSOR_CLOUD_REPO_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY != '' && vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }}
          SONAR_BRANCH: ${{ vars.SONAR_BRANCH || 'main' }}
          CURSOR_DAILY_DIGEST_ISSUE_NUMBER: ${{ vars.CURSOR_DAILY_DIGEST_ISSUE_NUMBER }}
          CURSOR_DAILY_DIGEST_MODEL: ${{ vars.CURSOR_DAILY_DIGEST_MODEL }}
          CURSOR_DAILY_DIGEST_TOP_ISSUES: ${{ vars.CURSOR_DAILY_DIGEST_TOP_ISSUES }}
          CURSOR_ALLOW_COMMENT_FAILURE: "false"
        run: pnpm --filter @rpgtracker/cursor-agents run daily-quality-digest

      # Pillar C (M4): build the unified maintenance queue (Sonar + tech-debt issues),
      # apply triage scoring + the concurrent bot-PR cap, and publish the selection.
      # Dispatch of selected items is handled by a Cursor Automation (see
      # docs/guides/agentic-pipeline-operator-checklist.md), not by this workflow.
      - name: Build maintenance queue selection
        env:
          GITHUB_TOKEN: ${{ secrets.CURSOR_PR_REVIEW_TOKEN != '' && secrets.CURSOR_PR_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY != '' && vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }}
          SONAR_BRANCH: ${{ vars.SONAR_BRANCH || 'main' }}
          CURSOR_QUEUE_BOT_PR_CAP: ${{ vars.CURSOR_QUEUE_BOT_PR_CAP }}
          CURSOR_QUEUE_TOP_K: ${{ vars.CURSOR_QUEUE_TOP_K }}
          CURSOR_QUEUE_ISSUE_LABEL: ${{ vars.CURSOR_QUEUE_ISSUE_LABEL }}
        run: pnpm --filter @rpgtracker/cursor-agents run maintenance-queue

      - name: Upload maintenance queue + run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-queue-${{ github.run_id }}
          path: |
            maintenance-queue.json
            cursor-agent-run-summaries/
          if-no-files-found: ignore

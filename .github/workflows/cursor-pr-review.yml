name: Cursor PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  cursor-pr-review:
    # vars.AGENTS_ENABLED is the repo-side kill-switch for all agent automation (brief §4, M0).
    if: vars.AGENTS_ENABLED != 'false' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure ripgrep path for Cursor SDK
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          echo "CURSOR_RIPGREP_PATH=$(command -v rg)" >> "$GITHUB_ENV"

      - name: Run Cursor PR review agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CURSOR_PR_REVIEW_TOKEN != '' && secrets.CURSOR_PR_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURSOR_RUNTIME: ${{ vars.CURSOR_RUNTIME || 'local' }}
          CURSOR_CLOUD_REPO_URL: ${{ vars.CURSOR_CLOUD_REPO_URL }}
          CURSOR_ALLOW_COMMENT_FAILURE: "false"
          CURSOR_REVIEW_MAX_FINDINGS: ${{ vars.CURSOR_REVIEW_MAX_FINDINGS }}
          CURSOR_REVIEW_MODELS: ${{ vars.CURSOR_REVIEW_MODELS }}
        run: pnpm --filter @rpgtracker/cursor-agents run pr-review
